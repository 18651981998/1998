<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>单词听写工具</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --bg-color: #f5f7fa;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-sub: #666666;
            --border-color: #e0e0e0;
            --safe-area-bottom: env(safe-area-inset-bottom);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg-color); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; max-width: 480px; margin: 0 auto; position: relative; }
        
        /* Header */
        header { background: var(--card-bg); padding: 15px; text-align: center; font-size: 18px; font-weight: bold; border-bottom: 1px solid var(--border-color); flex-shrink: 0; z-index: 10; }
        
        /* Main Content Area */
        main { flex: 1; overflow-y: auto; padding: 15px; padding-bottom: calc(60px + var(--safe-area-bottom)); -webkit-overflow-scrolling: touch; }
        
        /* Bottom Nav */
        nav { position: absolute; bottom: 0; left: 0; right: 0; background: var(--card-bg); border-top: 1px solid var(--border-color); display: flex; justify-content: space-around; padding-bottom: var(--safe-area-bottom); z-index: 20; }
        nav button { flex: 1; background: none; border: none; padding: 10px 0; font-size: 12px; color: var(--text-sub); display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; }
        nav button.active { color: var(--primary-color); }
        nav button span { font-size: 20px; }

        /* Components */
        .card { background: var(--card-bg); border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .btn { background: var(--primary-color); color: white; border: none; padding: 10px 20px; border-radius: 8px; font-size: 14px; cursor: pointer; width: 100%; margin-top: 10px; }
        .btn-outline { background: transparent; border: 1px solid var(--primary-color); color: var(--primary-color); }
        .btn-danger { background: #ff4d4f; }
        .row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .label { font-size: 14px; color: var(--text-sub); }
        select, input { width: 100%; padding: 8px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 14px; margin-top: 5px; }
        
        /* List Items */
        .list-item { display: flex; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border-color); }
        .list-item:last-child { border-bottom: none; }
        .word-text { font-size: 16px; font-weight: 500; flex: 1; }
        .word-trans { font-size: 12px; color: var(--text-sub); margin-left: 8px; }
        .icon-btn { background: none; border: none; font-size: 18px; padding: 5px; cursor: pointer; color: var(--primary-color); }

        /* Player Overlay */
        #player-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: var(--primary-color); z-index: 100; display: none; flex-direction: column; align-items: center; justify-content: center; color: white; text-align: center; padding: 20px; }
        #player-overlay.show { display: flex; }
        .player-word { font-size: 32px; font-weight: bold; margin-bottom: 10px; min-height: 40px; }
        .player-trans { font-size: 18px; opacity: 0.8; margin-bottom: 40px; min-height: 24px; }
        .player-controls { display: flex; gap: 30px; align-items: center; }
        .ctrl-btn { background: rgba(255,255,255,0.2); border: none; color: white; width: 60px; height: 60px; border-radius: 50%; font-size: 24px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .ctrl-btn.main { width: 80px; height: 80px; font-size: 32px; background: white; color: var(--primary-color); }
        .close-player { position: absolute; top: 20px; right: 20px; background: none; border: none; color: white; font-size: 24px; cursor: pointer; }

        /* Toast */
        #toast { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.7); color: white; padding: 10px 20px; border-radius: 20px; font-size: 14px; z-index: 200; display: none; pointer-events: none; }

        /* Tab Content Visibility */
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Reader Bubbles */
        .bubble { background: #e8f0fe; padding: 10px 15px; border-radius: 15px; margin-bottom: 10px; position: relative; cursor: pointer; max-width: 85%; }
        .bubble.right { margin-left: auto; background: #d4edda; }
        .bubble .cn { font-size: 12px; color: var(--text-sub); margin-top: 4px; display: none; }
        .bubble.show-cn .cn { display: block; }
    </style>
</head>
<body>

<header id="page-title">🎧 听写</header>

<main>
    <!-- Tab 1: Dictation -->
    <div id="tab-dictation" class="tab-content active">
        <div class="card">
            <div class="row"><span class="label">播报模式</span>
                <select id="dict-mode"><option value="en">英文</option><option value="cn">中文</option><option value="both">英+中</option></select>
            </div>
            <div class="row"><span class="label">语速</span>
                <select id="dict-speed"><option value="0.7">慢速 (0.7x)</option><option value="1.0" selected>正常 (1.0x)</option><option value="1.3">快速 (1.3x)</option></select>
            </div>
            <div class="row"><span class="label">重复次数</span>
                <select id="dict-repeat"><option value="1">1次</option><option value="2" selected>2次</option><option value="3">3次</option></select>
            </div>
            <div class="row"><span class="label">间隔时间</span>
                <select id="dict-interval"><option value="1000">1秒</option><option value="2000" selected>2秒</option><option value="3000">3秒</option></select>
            </div>
            <div class="row"><span class="label">播放顺序</span>
                <select id="dict-order"><option value="seq">顺序</option><option value="rand">随机</option></select>
            </div>
            <div class="row"><span class="label">显示单词</span>
                <select id="dict-show-word"><option value="no">隐藏</option><option value="yes">显示</option></select>
            </div>
        </div>
        <div class="card">
            <div class="row">
                <span class="label">待听写列表 (<span id="dict-count">0</span>)</span>
                <button class="icon-btn" onclick="clearDictList()" title="清空">🗑️</button>
            </div>
            <div id="dict-list-preview" style="max-height: 150px; overflow-y: auto; font-size: 13px; color: var(--text-sub); margin-bottom: 10px;"></div>
            <button class="btn" onclick="startDictation()">▶ 开始听写</button>
            <button class="btn btn-outline" onclick="unlockAudio()" style="margin-top: 5px;">🔓 解锁语音</button>
        </div>
    </div>

    <!-- Tab 2: Library -->
    <div id="tab-library" class="tab-content">
        <div class="card">
            <select id="lib-version" onchange="loadGrades()"><option value="">选择教材版本</option></select>
            <select id="lib-grade" onchange="loadUnits()" disabled><option value="">选择年级</option></select>
            <select id="lib-unit" disabled><option value="">选择单元</option></select>
            <button class="btn" onclick="loadUnitWords()">加载单词</button>
        </div>
        <div class="card" id="lib-words-card" style="display:none;">
            <div class="row">
                <span class="label">单词列表</span>
                <div>
                    <button class="icon-btn" onclick="toggleAllLibWords()">☑️</button>
                    <button class="icon-btn" onclick="addSelectedToDict()">➕</button>
                </div>
            </div>
            <div id="lib-words-list"></div>
        </div>
    </div>

    <!-- Tab 3: Custom -->
    <div id="tab-custom" class="tab-content">
        <div class="card">
            <textarea id="custom-input" rows="6" placeholder="每行一个：单词 翻译&#10;例如：&#10;apple 苹果&#10;first(1st) 第一" style="width:100%; padding:10px; border:1px solid var(--border-color); border-radius:8px; font-size:14px; resize:none;"></textarea>
            <button class="btn" onclick="saveCustomList()">💾 保存词表</button>
        </div>
        <div class="card">
            <div class="row"><span class="label">我的词表</span><button class="icon-btn" onclick="clearAllCustom()">🗑️</button></div>
            <div id="custom-saved-list"></div>
        </div>
    </div>

    <!-- Tab 4: Reader -->
    <div id="tab-reader" class="tab-content">
        <div class="card">
            <select id="reader-version" onchange="loadReaderGrades()"><option value="">选择教材版本</option></select>
            <select id="reader-grade" onchange="loadReaderUnits()" disabled><option value="">选择年级</option></select>
            <select id="reader-unit" disabled><option value="">选择单元</option></select>
            <button class="btn" onclick="loadReaderContent()">加载课文</button>
        </div>
        <div class="card" id="reader-content-card" style="display:none;">
            <div class="row">
                <span class="label">课文点读</span>
                <div>
                    <button class="icon-btn" onclick="toggleReaderCn()">👁️</button>
                    <button class="icon-btn" onclick="playAllReader()">▶️</button>
                    <button class="icon-btn" onclick="cycleReaderSpeed()" id="reader-speed-btn">1.0x</button>
                </div>
            </div>
            <div id="reader-bubbles"></div>
        </div>
    </div>
</main>

<nav>
    <button class="active" onclick="switchTab('dictation', this)"><span>🎧</span>听写</button>
    <button onclick="switchTab('library', this)"><span>📚</span>词库</button>
    <button onclick="switchTab('custom', this)"><span>✏️</span>自定义</button>
    <button onclick="switchTab('reader', this)"><span>📖</span>点读</button>
</nav>

<!-- Player Overlay -->
<div id="player-overlay">
    <button class="close-player" onclick="stopDictation()">✕</button>
    <div class="player-word" id="p-word"></div>
    <div class="player-trans" id="p-trans"></div>
    <div class="player-controls">
        <button class="ctrl-btn" onclick="prevWord()">⏮</button>
        <button class="ctrl-btn main" id="p-play-btn" onclick="togglePlay()">⏸</button>
        <button class="ctrl-btn" onclick="nextWord()">⏭</button>
    </div>
    <div style="margin-top:30px; font-size:14px; opacity:0.7;" id="p-progress"></div>
</div>

<div id="toast"></div>

<script>
// ==================== GLOBAL STATE ====================
const state = {
    dictList: JSON.parse(localStorage.getItem('dictList') || '[]'),
    settings: JSON.parse(localStorage.getItem('dictSettings') || '{}'),
    customLists: JSON.parse(localStorage.getItem('customLists') || '{}'),
    player: { list: [], index: 0, playing: false, timer: null, repeatCount: 0 },
    readerSpeed: 1.0,
    audioUnlocked: false
};

// ==================== TAB NAVIGATION ====================
function switchTab(tabName, btn) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.getElementById('tab-' + tabName).classList.add('active');
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
    if(btn) btn.classList.add('active');
    const titles = { dictation:'🎧 听写', library:'📚 词库', custom:'✏️ 自定义', reader:'📖 点读' };
    document.getElementById('page-title').textContent = titles[tabName];
}

// ==================== TOAST ====================
function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 2000);
}

// ==================== AUDIO UNLOCK ====================
function unlockAudio() {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const buf = ctx.createBuffer(1, 1, 22050);
    const src = ctx.createBufferSource();
    src.buffer = buf; src.connect(ctx.destination); src.start(0);
    state.audioUnlocked = true;
    showToast('🔓 语音已解锁');
}

// ==================== 【核心修复】TTS & CLEAN TEXT ====================

/**
 * 【修复版】cleanText
 * 智能清洗文本，专门处理 first(1st)、twelfth(12th) 等序数词格式
 * 确保有道API能获取到正确的发音词形，同时不影响中文播报
 */
function cleanText(str) {
    if (!str) return '';
    
    // 1. 移除音标 /xxx/
    str = str.replace(/\s*\/[^\/]*\/\s*/g, '');
    
    // 2. 移除中文括号 【】〖〗
    str = str.replace(/[\u3010\u3011\uFF5B\uFF5D\u3014\u3015]/g, '');
    
    // 3. 序数词映射表
    const ordinalMap = {
        '1st':'first','2nd':'second','3rd':'third','4th':'fourth','5th':'fifth',
        '6th':'sixth','7th':'seventh','8th':'eighth','9th':'ninth','10th':'tenth',
        '11th':'eleventh','12th':'twelfth','13th':'thirteenth','14th':'fourteenth',
        '15th':'fifteenth','16th':'sixteenth','17th':'seventeenth','18th':'eighteenth',
        '19th':'nineteenth','20th':'twentieth','21st':'twenty-first','22nd':'twenty-second',
        '23rd':'twenty-third','24th':'twenty-fourth','25th':'twenty-fifth',
        '26th':'twenty-sixth','27th':'twenty-seventh','28th':'twenty-eighth',
        '29th':'twenty-ninth','30th':'thirtieth','31st':'thirty-first'
    };

    let cleaned = str;

    // 4. 处理 word(num) 格式，如 first(1st)
    const parenMatch = str.match(/^([a-zA-Z\-]+)\s*\(\s*([a-zA-Z0-9]+)\s*\)$/);
    if (parenMatch) {
        const wordPart = parenMatch[1].trim();
        const numPart = parenMatch[2].trim().toLowerCase();
        if (ordinalMap[numPart]) {
            cleaned = ordinalMap[numPart];
        } else if (wordPart) {
            cleaned = wordPart;
        }
    } else {
        // 5. 处理纯序数词，如 12th, 21st
        const pureOrdinal = str.match(/^(\d+)(st|nd|rd|th)$/i);
        if (pureOrdinal) {
            const full = pureOrdinal[0].toLowerCase();
            cleaned = ordinalMap[full] || full;
        }
    }

    // 6. 对非序数词的普通括号内容移除（如注释）
    const knownOrdinals = Object.values(ordinalMap);
    if (!knownOrdinals.includes(cleaned.toLowerCase())) {
        cleaned = cleaned.replace(/\s*\([^)]*\)\s*/g, '').trim();
    }

    // 7. 清理多余符号，保留字母、数字、连字符、撇号
    cleaned = cleaned.replace(/[^\w\s\-']/g, '').trim();
    cleaned = cleaned.replace(/\s+/g, ' ');

    return cleaned || str;
}

/**
 * 【修复版】getPronunciationUrl
 * 生成有道词典发音URL，自动处理特殊字符编码和词形清洗
 */
function getPronunciationUrl(word) {
    if (!word) return '';
    
    let pronWord = cleanText(word);
    
    // 防止纯数字或空字符串导致有道API无声
    if (!pronWord || /^\d+$/.test(pronWord)) {
        pronWord = word.replace(/[^a-zA-Z\-']/g, '');
        if (!pronWord) pronWord = 'hello';
    }

    return `https://dict.youdao.com/dictvoice?audio=${encodeURIComponent(pronWord)}&type=2`;
}

/**
 * 播放英文发音（有道API）
 */
function playEnglishAudio(word, onEnd) {
    const url = getPronunciationUrl(word);
    const audio = new Audio(url);
    audio.playbackRate = parseFloat(document.getElementById('dict-speed')?.value || 1.0);
    
    let ended = false;
    const done = () => { if(!ended){ ended=true; onEnd && onEnd(); } };
    
    audio.onended = done;
    audio.onerror = done;
    // 超时兜底
    setTimeout(done, 5000);
    
    audio.play().catch(e => { console.warn('Audio play failed:', e); done(); });
}

/**
 * 播放中文发音（浏览器 speechSynthesis）
 */
function playChineseAudio(text, onEnd) {
    if (!text) { onEnd && onEnd(); return; }
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-CN';
    u.rate = parseFloat(document.getElementById('dict-speed')?.value || 1.0);
    let ended = false;
    const done = () => { if(!ended){ ended=true; onEnd && onEnd(); } };
    u.onend = done;
    u.onerror = done;
    setTimeout(done, 8000);
    window.speechSynthesis.speak(u);
}

// ==================== DICTATION LOGIC ====================
function updateDictPreview() {
    const el = document.getElementById('dict-list-preview');
    document.getElementById('dict-count').textContent = state.dictList.length;
    if (state.dictList.length === 0) { el.innerHTML = '<em>暂无单词，请从词库或自定义添加</em>'; return; }
    el.innerHTML = state.dictList.map(w => `<div>${w.word} <span style="color:#999">${w.trans}</span></div>`).join('');
}

function clearDictList() {
    if(confirm('确定清空听写列表？')) { state.dictList = []; saveDictList(); updateDictPreview(); }
}

function saveDictList() { localStorage.setItem('dictList', JSON.stringify(state.dictList)); }

function addWordsToDict(words) {
    const existing = new Set(state.dictList.map(w => w.word));
    let added = 0;
    words.forEach(w => { if(!existing.has(w.word)){ state.dictList.push(w); existing.add(w.word); added++; } });
    saveDictList(); updateDictPreview();
    showToast(`✅ 已添加 ${added} 个单词`);
}

function startDictation() {
    if (state.dictList.length === 0) { showToast('⚠️ 听写列表为空'); return; }
    if (!state.audioUnlocked) { showToast('⚠️ 请先点击"解锁语音"'); return; }
    
    const mode = document.getElementById('dict-mode').value;
    const order = document.getElementById('dict-order').value;
    const showWord = document.getElementById('dict-show-word').value;
    const repeat = parseInt(document.getElementById('dict-repeat').value);
    const interval = parseInt(document.getElementById('dict-interval').value);
    
    let list = [...state.dictList];
    if (order === 'rand') list.sort(() => Math.random() - 0.5);
    
    state.player = { list, index: 0, playing: true, timer: null, repeatCount: 0, mode, showWord, repeat, interval };
    
    document.getElementById('player-overlay').classList.add('show');
    playCurrentWord();
}

function stopDictation() {
    state.player.playing = false;
    clearTimeout(state.player.timer);
    window.speechSynthesis.cancel();
    document.getElementById('player-overlay').classList.remove('show');
}

function togglePlay() {
    state.player.playing = !state.player.playing;
    document.getElementById('p-play-btn').textContent = state.player.playing ? '⏸' : '▶';
    if (state.player.playing) playCurrentWord();
    else { clearTimeout(state.player.timer); window.speechSynthesis.cancel(); }
}

function prevWord() {
    if (state.player.index > 0) { state.player.index--; playCurrentWord(); }
}

function nextWord() {
    if (state.player.index < state.player.list.length - 1) { state.player.index++; playCurrentWord(); }
    else { showToast('🎉 听写完成！'); state.player.playing = false; document.getElementById('p-play-btn').textContent = '▶'; }
}

function playCurrentWord() {
    if (!state.player.playing) return;
    clearTimeout(state.player.timer);
    window.speechSynthesis.cancel();
    
    const p = state.player;
    const item = p.list[p.index];
    
    // Update UI
    document.getElementById('p-word').textContent = p.showWord === 'yes' ? item.word : '';
    document.getElementById('p-trans').textContent = (p.mode === 'cn' || p.mode === 'both') ? item.trans : '';
    document.getElementById('p-progress').textContent = `${p.index + 1} / ${p.list.length}`;
    document.getElementById('p-play-btn').textContent = '⏸';
    
    p.repeatCount = 0;
    playOneRound(item);
}

function playOneRound(item) {
    if (!state.player.playing) return;
    const p = state.player;
    
    const doNext = () => {
        p.repeatCount++;
        if (p.repeatCount < p.repeat) {
            p.timer = setTimeout(() => playOneRound(item), p.interval);
        } else {
            p.timer = setTimeout(() => nextWord(), p.interval);
        }
    };
    
    if (p.mode === 'en') {
        playEnglishAudio(item.word, doNext);
    } else if (p.mode === 'cn') {
        playChineseAudio(item.trans, doNext);
    } else { // both
        playEnglishAudio(item.word, () => {
            setTimeout(() => playChineseAudio(item.trans, doNext), 500);
        });
    }
}

// ==================== LIBRARY (Placeholder Data) ====================
const LIB_DATA = {
    "PEP人教版": {
        "三年级起点": {
            "三上": [
                {word:"hello",trans:"你好"},{word:"hi",trans:"嗨"},{word:"goodbye",trans:"再见"},
                {word:"first(1st)",trans:"第一"},{word:"second(2nd)",trans:"第二"},{word:"twelfth(12th)",trans:"第十二"}
            ],
            "三下": [{word:"boy",trans:"男孩"},{word:"girl",trans:"女孩"},{word:"teacher",trans:"老师"}]
        }
    },
    "外研社版": {
        "一年级起点": {
            "一上": [{word:"book",trans:"书"},{word:"pen",trans:"钢笔"}]
        }
    }
};

function loadVersions(selId) {
    const sel = document.getElementById(selId);
    sel.innerHTML = '<option value="">选择教材版本</option>';
    Object.keys(LIB_DATA).forEach(v => sel.innerHTML += `<option value="${v}">${v}</option>`);
}

function loadGrades() {
    const ver = document.getElementById('lib-version').value;
    const sel = document.getElementById('lib-grade');
    sel.innerHTML = '<option value="">选择年级</option>'; sel.disabled = !ver;
    document.getElementById('lib-unit').disabled = true;
    if(ver) Object.keys(LIB_DATA[ver]).forEach(g => sel.innerHTML += `<option value="${g}">${g}</option>`);
}

function loadUnits() {
    const ver = document.getElementById('lib-version').value;
    const grade = document.getElementById('lib-grade').value;
    const sel = document.getElementById('lib-unit');
    sel.innerHTML = '<option value="">选择单元</option>'; sel.disabled = !grade;
    if(ver && grade) Object.keys(LIB_DATA[ver][grade]).forEach(u => sel.innerHTML += `<option value="${u}">${u}</option>`);
}

function loadUnitWords() {
    const ver = document.getElementById('lib-version').value;
    const grade = document.getElementById('lib-grade').value;
    const unit = document.getElementById('lib-unit').value;
    if(!ver||!grade||!unit) { showToast('⚠️ 请选择完整路径'); return; }
    const words = LIB_DATA[ver][grade][unit] || [];
    const card = document.getElementById('lib-words-card');
    card.style.display = 'block';
    const list = document.getElementById('lib-words-list');
    list.innerHTML = words.map((w,i) => `
        <div class="list-item">
            <input type="checkbox" class="lib-check" data-idx="${i}" checked style="width:auto;margin-right:10px;">
            <span class="word-text">${w.word}</span>
            <span class="word-trans">${w.trans}</span>
            <button class="icon-btn" onclick="playEnglishAudio('${w.word.replace(/'/g,"\\'")}')">🔊</button>
        </div>
    `).join('');
    card._words = words;
}

function toggleAllLibWords() {
    const checks = document.querySelectorAll('.lib-check');
    const allChecked = [...checks].every(c => c.checked);
    checks.forEach(c => c.checked = !allChecked);
}

function addSelectedToDict() {
    const card = document.getElementById('lib-words-card');
    if(!card._words) return;
    const selected = [...document.querySelectorAll('.lib-check:checked')].map(c => card._words[c.dataset.idx]);
    addWordsToDict(selected);
}

// ==================== CUSTOM LISTS ====================
function saveCustomList() {
    const input = document.getElementById('custom-input').value.trim();
    if(!input) { showToast('⚠️ 请输入内容'); return; }
    const name = prompt('请输入词表名称：');
    if(!name) return;
    const words = input.split('\n').map(line => {
        const parts = line.trim().split(/[\s\t]+/);
        return { word: parts[0], trans: parts.slice(1).join(' ') || '' };
    }).filter(w => w.word);
    state.customLists[name] = words;
    localStorage.setItem('customLists', JSON.stringify(state.customLists));
    renderCustomLists();
    showToast(`✅ 已保存"${name}"`);
}

function renderCustomLists() {
    const el = document.getElementById('custom-saved-list');
    const names = Object.keys(state.customLists);
    if(names.length === 0) { el.innerHTML = '<em>暂无词表</em>'; return; }
    el.innerHTML = names.map(n => `
        <div class="list-item">
            <span class="word-text">${n} (${state.customLists[n].length}词)</span>
            <button class="icon-btn" onclick="loadCustomToList('${n}')">📥</button>
            <button class="icon-btn" onclick="deleteCustomList('${n}')">🗑️</button>
        </div>
    `).join('');
}

function loadCustomToList(name) { addWordsToDict(state.customLists[name]); }
function deleteCustomList(name) {
    if(confirm(`删除词表"${name}"？`)) {
        delete state.customLists[name];
        localStorage.setItem('customLists', JSON.stringify(state.customLists));
        renderCustomLists();
    }
}
function clearAllCustom() {
    if(confirm('确定清空所有自定义词表？')) {
        state.customLists = {};
        localStorage.setItem('customLists', '{}');
        renderCustomLists();
    }
}

// ==================== READER ====================
function loadReaderGrades() { loadGrades.call(null); /* reuse same structure for demo */ 
    const ver = document.getElementById('reader-version').value;
    const sel = document.getElementById('reader-grade');
    sel.innerHTML = '<option value="">选择年级</option>'; sel.disabled = !ver;
    document.getElementById('reader-unit').disabled = true;
    if(ver && LIB_DATA[ver]) Object.keys(LIB_DATA[ver]).forEach(g => sel.innerHTML += `<option value="${g}">${g}</option>`);
}
function loadReaderUnits() {
    const ver = document.getElementById('reader-version').value;
    const grade = document.getElementById('reader-grade').value;
    const sel = document.getElementById('reader-unit');
    sel.innerHTML = '<option value="">选择单元</option>'; sel.disabled = !grade;
    if(ver && grade && LIB_DATA[ver]?.[grade]) Object.keys(LIB_DATA[ver][grade]).forEach(u => sel.innerHTML += `<option value="${u}">${u}</option>`);
}
function loadReaderContent() {
    const ver = document.getElementById('reader-version').value;
    const grade = document.getElementById('reader-grade').value;
    const unit = document.getElementById('reader-unit').value;
    if(!ver||!grade||!unit) { showToast('⚠️ 请选择完整路径'); return; }
    const words = LIB_DATA[ver]?.[grade]?.[unit] || [];
    document.getElementById('reader-content-card').style.display = 'block';
    const container = document.getElementById('reader-bubbles');
    container.innerHTML = words.map((w,i) => `
        <div class="bubble ${i%2===0?'':'right'}" onclick="playEnglishAudio('${w.word.replace(/'/g,"\\'")}'); this.classList.add('show-cn')">
            <div>${w.word}</div>
            <div class="cn">${w.trans}</div>
        </div>
    `).join('');
}
function toggleReaderCn() {
    document.querySelectorAll('#reader-bubbles .bubble').forEach(b => b.classList.toggle('show-cn'));
}
function cycleReaderSpeed() {
    const speeds = [0.7, 0.85, 1.0, 1.2];
    let idx = speeds.indexOf(state.readerSpeed);
    state.readerSpeed = speeds[(idx+1) % speeds.length];
    document.getElementById('reader-speed-btn').textContent = state.readerSpeed + 'x';
}
function playAllReader() {
    const bubbles = document.querySelectorAll('#reader-bubbles .bubble div:first-child');
    if(bubbles.length === 0) return;
    let i = 0;
    const playNext = () => {
        if(i >= bubbles.length) { showToast('✅ 播放完毕'); return; }
        const text = bubbles[i].textContent;
        const audio = new Audio(getPronunciationUrl(text));
        audio.playbackRate = state.readerSpeed;
        audio.onended = () => { i++; setTimeout(playNext, 500); };
        audio.onerror = () => { i++; setTimeout(playNext, 500); };
        audio.play().catch(() => { i++; setTimeout(playNext, 500); });
    };
    playNext();
}

// ==================== INIT ====================
window.addEventListener('DOMContentLoaded', () => {
    updateDictPreview();
    loadVersions('lib-version');
    loadVersions('reader-version');
    renderCustomLists();
    
    // Restore settings
    ['dict-mode','dict-speed','dict-repeat','dict-interval','dict-order','dict-show-word'].forEach(id => {
        if(state.settings[id]) document.getElementById(id).value = state.settings[id];
    });
    
    // Save settings on change
    document.querySelectorAll('#tab-dictation select').forEach(sel => {
        sel.addEventListener('change', () => {
            state.settings[sel.id] = sel.value;
            localStorage.setItem('dictSettings', JSON.stringify(state.settings));
        });
    });
});
</script>
